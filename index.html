<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sector 72 - WebAR Comic</title>
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Courier New', Courier, monospace;
      }
      .ui-container {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
      }
      button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #00ffcc;
        color: #111;
        border: 2px solid #0088aa;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0px 0px 15px #00ffcc;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.95);
      }
      .instructions {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 2px 2px 4px #000;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="instructions">
      <h2>Apunta tu cámara al marcador "Hiro"</h2>
    </div>

    <div class="ui-container">
      <button id="nextBtn">Siguiente Viñeta (1/10)</button>
    </div>

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <!-- Marcador Hiro -->
      <a-marker preset="hiro">
        
        <a-entity id="comic-panel" position="0 0.5 0" rotation="-90 0 0">
          <a-plane width="3.2" height="1.8" color="#0a0a0a" opacity="0.9" position="0 0 -0.05"></a-plane>
          <a-plane width="3.3" height="1.9" color="#00ffcc" opacity="0.3" position="0 0 -0.1"></a-plane>

          <a-text id="story-text" 
                  value="[1/10]\nSector 72.\nLa lluvia nunca para de quemar...\nEl joven hacker camina con su\ntortuga biomecanica." 
                  align="center" 
                  color="#00ffcc" 
                  width="3" 
                  position="0 0.3 0.1">
          </a-text>

          <a-box id="hacker-model" position="-0.8 -0.4 0.1" depth="0.3" height="0.6" width="0.4" color="#ff0055" animation="property: position; to: -0.8 -0.35 0.1; dir: alternate; dur: 1000; loop: true"></a-box>
          <a-cylinder id="turtle-model" position="0.8 -0.5 0.1" radius="0.25" height="0.15" color="#00aa44" animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true"></a-cylinder>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const panels = [
        "[1/10]\nSector 72.\nLa lluvia nunca para de quemar...\nEl joven hacker camina con su\ntortuga biomecanica.",
        "[2/10]\nLa Torre de la Corporacion...\nimpenetrable.\nUn paso en falso y todo habra terminado.",
        "[3/10]\nPuerto de enlace localizado.\nEnlazando terminal...\nIniciando secuencia de hackeo.",
        "[4/10]\nCortafuegos superado.\nDentro del sistema...\nel tiempo corre.",
        "[5/10]\nEl nucleo de datos...\nuna catedral de secretos.\nProcesando al limite...",
        "[6/10]\n¡ALERTA!\nIntrusion detectada, error de sistema.\n¡El acceso ha sido denegado!",
        "[7/10]\n¡Sobrecarga de pulso!\nTenemos que salir de aqui ya.\nLa ultima carta...",
        "[8/10]\nDesvanecerse en las sombras...\nLa multitud es mi mejor aliada.\nSolo una sombra mas.",
        "[9/10]\nLa informacion esta a salvo.\nAqui tienes el plano de la torre.\nEl trabajo esta hecho.",
        "[10/10]\nPor fin... un respiro.\nMañana sera otro dia\nen el Sector 72."
      ];

      let currentIndex = 0;
      const textElement = document.querySelector('#story-text');
      const btn = document.querySelector('#nextBtn');
      const hacker = document.querySelector('#hacker-model');
      const turtle = document.querySelector('#turtle-model');

      btn.addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= panels.length) {
          currentIndex = 0;
        }
        
        textElement.setAttribute('value', panels[currentIndex]);
        btn.innerText = `Siguiente Viñeta (${currentIndex + 1}/10)`;

        if (currentIndex === 5) {
          hacker.setAttribute('color', '#ff0000');
          turtle.setAttribute('color', '#ff3300');
        } else {
          hacker.setAttribute('color', currentIndex % 2 === 0 ? '#ff0055' : '#ffaa00');
          turtle.setAttribute('color', '#00aa44');
        }
        
        turtle.object3D.scale.set(1.2, 1.2, 1.2);
        setTimeout(() => {
          turtle.object3D.scale.set(1, 1, 1);
        }, 200);
      });
    </script>
  </body>
</html>
