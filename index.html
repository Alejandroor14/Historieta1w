html_content = """<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sector 72 - WebAR Comic</title>
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Courier New', Courier, monospace;
      }
      .ui-container {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
      }
      button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #00ffcc;
        color: #111;
        border: 2px solid #0088aa;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0px 0px 15px #00ffcc;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.95);
      }
      .instructions {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 2px 2px 4px #000;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="instructions">
      <h2>Apunta tu cámara a un marcador "Hiro"</h2>
    </div>

    <div class="ui-container">
      <button id="nextBtn">Siguiente Viñeta (1/8)</button>
    </div>

    <!-- Escena AR, deshabilitando la UI de debug para que se vea limpio -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <!-- Usamos el marcador Hiro estándar para una prueba rápida y efectiva -->
      <a-marker preset="hiro">
        
        <!-- Contenedor de la historieta -->
        <a-entity id="comic-panel" position="0 0.5 0" rotation="-90 0 0">
          <!-- Fondo holográfico de la viñeta -->
          <a-plane width="3.2" height="1.8" color="#0a0a0a" opacity="0.9" position="0 0 -0.05"></a-plane>
          <a-plane width="3.3" height="1.9" color="#00ffcc" opacity="0.3" position="0 0 -0.1"></a-plane>

          <!-- Texto dinámico de la historia -->
          <a-text id="story-text" 
                  value="[1/8]\nNeo-Tenochtitlan, 2072.\nUn hacker de gorra desgastada teclea\nfreneticamente en las sombras." 
                  align="center" 
                  color="#00ffcc" 
                  width="3" 
                  position="0 0.3 0.1">
          </a-text>

          <!-- Avatares representativos (Hacker y Pochitoque) -->
          <!-- Hacker -->
          <a-box id="hacker-model" position="-0.8 -0.4 0.1" depth="0.3" height="0.6" width="0.4" color="#ff0055" animation="property: position; to: -0.8 -0.35 0.1; dir: alternate; dur: 1000; loop: true"></a-box>
          <!-- Tortuga biomecánica -->
          <a-cylinder id="turtle-model" position="0.8 -0.5 0.1" radius="0.25" height="0.15" color="#00aa44" animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true"></a-cylinder>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Historia de 8 viñetas: Sector 72
      const panels = [
        "[1/8]\\nNeo-Tenochtitlan, 2072.\\nUn hacker de gorra desgastada teclea\\nfreneticamente en las sombras.",
        "[2/8]\\nA su lado, un pochitoque biomecanico\\nescanea la red, iluminando el callejon\\ncon su caparazon de neon.",
        "[3/8]\\n'¡Nos han detectado!', alerta el hacker\\nal ver su terminal parpadear\\nen rojo sangre.",
        "[4/8]\\nRapidamente, el pochitoque conecta\\nun cable desde su pata bionica\\ndirecto al nodo principal.",
        "[5/8]\\n¡Chispas saltan!\\nEl sistema de defensa corporativo\\nlanza un contraataque agresivo.",
        "[6/8]\\nSin dudarlo, el pequeño reptil\\ndespliega un escudo holografico\\nde firewall cuantico.",
        "[7/8]\\n'Acceso denegado a los trajes',\\nsonrie el hacker mientras\\ndescarga los ultimos datos.",
        "[8/8]\\nAmbos desaparecen en la niebla\\ndel Sector 72 antes de que lleguen\\nlos drones. ¡Mision cumplida!"
      ];

      let currentIndex = 0;
      const textElement = document.querySelector('#story-text');
      const btn = document.querySelector('#nextBtn');
      const hacker = document.querySelector('#hacker-model');
      const turtle = document.querySelector('#turtle-model');

      // Interactividad mediante el botón en pantalla
      btn.addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= panels.length) {
          currentIndex = 0; // Reiniciar
        }
        
        // Actualizar texto
        textElement.setAttribute('value', panels[currentIndex]);
        btn.innerText = `Siguiente Viñeta (${currentIndex + 1}/8)`;

        // Pequeñas reacciones en los modelos 3D al cambiar de viñeta
        hacker.setAttribute('color', currentIndex % 2 === 0 ? '#ff0055' : '#ffaa00');
        turtle.object3D.scale.set(1.2, 1.2, 1.2);
        setTimeout(() => {
          turtle.object3D.scale.set(1, 1, 1);
        }, 200);
      });
    </script>
  </body>
</html>
"""

with open("historieta_ar.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("Archivo HTML generado.")
